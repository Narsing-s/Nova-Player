name: Nova Player Signed Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Add ANDROID_KEYSTORE_BASE64 in repository Actions secrets." && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "::error::Add ANDROID_KEYSTORE_PASSWORD in repository Actions secrets." && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Add ANDROID_KEY_ALIAS in repository Actions secrets." && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Add ANDROID_KEY_PASSWORD in repository Actions secrets." && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
          test -s "$RUNNER_TEMP/nova-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then TAG="manual-${GITHUB_SHA::7}"; fi
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --title "Nova Player $TAG" \
            --notes "Signed Android APK for Nova Player. Verify the publisher and install only if you trust this build." \
            --repo "$GITHUB_REPOSITORY" || {
              echo "Release creation failed. If this tag already has a release, upload the APK to that release with gh release upload."
              exit 1
            }

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-player-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
