name: Nova Player Signed Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All Android signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets are incomplete. A debug APK will be built and uploaded instead; no signed GitHub Release will be published."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests before release
        run: gradle --no-daemon testDebugUnitTest

      # Keep lint advisory initially so existing findings don't unexpectedly block publishing.
      - name: Run Android lint
        run: gradle --no-daemon lintDebug
        continue-on-error: true

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-player-release-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-release.jks"
          test -s "$RUNNER_TEMP/nova-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nova-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Create GitHub Release and upload APK
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then TAG="manual-${GITHUB_SHA::7}"; fi
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk \
            --title "Nova Player $TAG" \
            --notes "Signed Android APK for Nova Player. Verify the publisher and install only if you trust this build." \
            --repo "$GITHUB_REPOSITORY" || {
              echo "Release creation failed. If this tag already has a release, upload the APK to that release with gh release upload."
              exit 1
            }

      - name: Upload signed APK as workflow artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-player-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Build debug APK when signing is not configured
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK fallback
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-player-debug-fallback
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
