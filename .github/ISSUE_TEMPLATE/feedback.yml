name: Nova Player feedback
description: Share ideas, usability feedback, or playback feedback for offline Nova Player.
title: "[Feedback]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Nova Player! This is a public GitHub issue. Please do not include personal, sensitive, or private media details.
  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      description: What would you like to share?
      options:
        - Feature request
        - User interface / usability
        - Playback experience
        - Subtitle or audio track
        - Performance or battery
        - Accessibility
        - Other
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Overall experience
      options:
        - "5 - Excellent"
        - "4 - Good"
        - "3 - Okay"
        - "2 - Needs improvement"
        - "1 - Poor"
        - Not applicable
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      description: Optional; for example, Pixel 8 or Samsung Galaxy A54.
      placeholder: Android phone or tablet model
    validations:
      required: false
  - type: input
    id: android_version
    attributes:
      label: Android version
      placeholder: e.g. Android 14
    validations:
      required: false
  - type: input
    id: app_version
    attributes:
      label: Nova Player version or build
      description: If known, include the release version or GitHub Actions run.
      placeholder: e.g. latest debug APK
    validations:
      required: false
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: Tell us what works well or what could be better.
      placeholder: I like… / It would be helpful if…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (if applicable)
      description: For playback or UI issues, list the steps that lead to the problem.
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: false
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs. actual behavior (if applicable)
      placeholder: What did you expect, and what happened instead?
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Avoid sharing personal information or private video/subtitle files.
    validations:
      required: false
